-result.fs-overlay .machine-matrix-wrap,\n  .visual-result.fs-overlay .summary-panel{\n    min-width:0;\n    min-height:0;\n    height:100%;\n    overflow:hidden;\n    display:flex;\n    flex-direction:column;\n  }\n\n  .visual-result.fs-overlay .visual-heading{\n    flex:0 0 auto;\n    margin:1px 0 4px;\n    font-size:.8rem;\n  }\n\n  .visual-result.fs-overlay .mode-switch{\n    flex:0 0 auto;\n    margin:0 0 4px;\n    gap:4px;\n  }\n\n  .visual-result.fs-overlay .mode-switch button{\n    padding:4px 8px;\n    font-size:.72rem;\n  }\n\n  .visual-result.fs-overlay .operator-box{\n    padding:2px 8px;\n    font-size:.82rem;\n    min-height:28px;\n  }\n\n  .visual-result.fs-overlay .mode-note{\n    flex:0 0 auto;\n    margin:0 0 4px;\n    font-size:.65rem;\n    line-height:1.15;\n  }\n\n  /* 9 satır ekran yüksekliğine yayılır */\n  .visual-result.fs-overlay .machine-matrix{\n    flex:1 1 auto;\n    min-height:0;\n    height:auto;\n    grid-template-rows:repeat(9,minmax(0,1fr));\n    grid-auto-rows:minmax(0,1fr);\n  }\n\n  .visual-result.fs-overlay .matrix-cell,\n  .visual-result.fs-overlay .matrix-empty{\n    min-height:0;\n    height:auto;\n    padding:3px 6px;\n    font-size:.78rem;\n  }\n\n  .visual-result.fs-overlay .summary-table{\n    flex:1 1 auto;\n    min-height:0;\n    height:auto;\n    overflow:hidden;\n  }\n\n  .visual-result.fs-overlay .summary-row{\n    flex:1 1 0;\n    min-height:0;\n    height:auto;\n  }\n\n  .visual-result.fs-overlay .summary-row > div{\n    padding:4px 6px;\n    font-size:.72rem;\n  }\n\n  .visual-result.fs-overlay .summary-head{\n    flex:0 0 30px;\n    min-height:30px;\n  }\n\n  .visual-result.fs-overlay .summary-head > div{\n    font-size:.68rem;\n  }\n\n  /* Tam ekran butonu üstte sabit kalırken alan kaplamasın */\n  .visual-result.fs-overlay .fs-btn{\n    position:static;\n    flex:0 0 auto;\n  }\n}\n\n/* Çok geniş yatay telefonlarda da içerik kenarlara yayılsın */\n@media (orientation:landscape) and (min-height:701px){\n  .visual-result.fs-overlay{\n    display:grid !important;\n    grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;\n    grid-template-rows:minmax(0,1fr);\n    height:100dvh;\n    min-height:100dvh;\n    gap:10px;\n    overflow:hidden;\n  }\n\n  .visual-result.fs-overlay .machine-matrix-wrap,\n  .visual-result.fs-overlay .summary-panel{\n    height:100%;\n    min-height:0;\n    overflow:hidden;\n    display:flex;\n    flex-direction:column;\n  }\n\n  .visual-result.fs-overlay .machine-matrix{\n    flex:1 1 auto;\n    min-height:0;\n    grid-template-rows:repeat(9,minmax(0,1fr));\n  }\n\n  .visual-result.fs-overlay .summary-table{\n    flex:1 1 auto;\n    min-height:0;\n  }\n\n  .visual-result.fs-overlay .summary-row{\n    flex:1 1 0;\n    min-height:0;\n  }\n}\n\n/* Dikey telefonda mevcut davranış korunur */\n@media (orientation:portrait) and (max-width:600px){\n  .visual-result.fs-overlay{\n    overflow:auto;\n    -webkit-overflow-scrolling:touch;\n  }\n}\n\n\n/* Telefon: hesaplamadan sonra ekran sonuç kartının başından başlasın */\n#resultCard{scroll-margin-top:4px}\n@media(max-width:600px){\n  #resultCard{padding:6px 6px 8px}\n  #resultCard h2{margin:0 0 6px;font-size:.95rem}\n  #resultCard .stats{margin-bottom:6px}\n  #resultCard .stat{padding:5px 8px}\n  #resultCard .stat strong{margin-top:2px;font-size:.95rem}\n  #resultCard .buttonrow{margin-top:6px}\n  #resultCard .buttonrow button{min-height:36px}\n  .footer{margin-top:6px}\n}\n</style>\n</head>\n<body>\n<header><div class=\"eyebrow\">Düğüm-Poy</div><h1>Makine Dağıtım Planlayıcısı</h1><p> Makine sayısı · Fiziksel yerleşim yakınlığı</p></header>\n<main>\n<div class=\"notice\"><strong>Bilgi:</strong>  Bilinmeyen tonajlar hesaplamada 0 kabul edilir. İşareti kaldırılan makineler Kapalı görünür ve grup özetinden çıkar. Joker seçilen makineler Joker grubunda gösterilir. Hesaplama bu tarayıcıda yapılır, girilen veriler sunucuya gönderilmez.</div>\n<div class=\"layout\">\n<section class=\"card\">\n<h2>Dağıtım ayarları</h2>\n<label class=\"field\" for=\"groupCount\">Oluşturulacak grup sayısı (1–6)</label>\n<select id=\"groupCount\"></select>\n<p class=\"small\">Algoritma, PowerShell sürümündeki 250 rastgele denemeyi ve yerel iyileştirme adımlarını temel alır.</p><p class=\"small\">Otomatik kayıt açık: Tonajlar, makine seçimleri ve grup sayısı bu tarayıcıda saklanır; sayfayı yeniden açtığınızda geri yüklenir.</p>\n<div class=\"buttonrow\"><button id=\"selectNone\" class=\"secondary\" type=\"button\">Tüm seçimleri kaldır</button><button id=\"selectAll\" class=\"secondary\" type=\"button\">Tümünü dahil et</button></div>\n<label class=\"field\">Makine listesi <span class=\"small\">(işaretini kaldırırsanız makine Kapalı olur ve grup özetinden çıkar)</span></label>\n<div id=\"machineList\" class=\"machine-list\"></div>\n<button id=\"run\" class=\"primary\" type=\"button\">Dengeli dağıtımı hesapla</button>\n<div id=\"error\" class=\"error\" role=\"alert\"></div>\n</section>\n<section class=\"card\" id=\"resultCard\">\n<div id=\"results\"><div class=\"empty\">Tonaj girdiğinizde veya seçimleri değiştirdiğinizde sonuç otomatik olarak yenilenir.</div></div>\n<div id=\"downloads\" class=\"buttonrow\" hidden><button id=\"downloadCsv\" class=\"secondary\" type=\"button\">CSV indir</button><button id=\"downloadTxt\" class=\"secondary\" type=\"button\">TXT raporu indir</button></div>\n</section>\n</div>\n<div class=\"footer\">Algoritma puanlaması: tonaj farkı ana kriter, makine sayısı ikincil kriter, fiziksel yakınlık daha düşük ağırlıktadır. Sonuçlar rastgele başlangıç sırasına bağlı olarak çalıştırmalar arasında değişebilir.</div>\n</main>\n<script>\n// MakineDagitim PowerShell algoritmasının tarayıcı sürümü.\n// Yerleşim (R/C), puan ağırlıkları, 250 deneme ve yerel iyileştirme korunmuştur.\nconst initialMachines = [\n [\"S3\",3110,0,0],[\"S2\",3628,0,1],[\"S1\",4608,0,2],\n [\"S9\",3110,1,0],[\"S8\",3918,1,1],[\"S7\",3110,1,2],\n [\"S15\",4147,2,0],[\"S14\",3110,2,1],[\"S13\",4147,2,2],\n [\"S21\",4147,3,0],[\"S20\",null,3,1],[\"S19\",6451,3,2],\n [\"S27\",4147,4,0],[\"S26\",7833,4,1],[\"S25\",null,4,2],\n [\"S33\",3916,5,0],[\"S32\",4531,5,1],[\"S31\",7603,5,2],\n [\"S39\",2995,6,0],[\"S38\",4147,6,1],[\"S37\",4147,6,2],\n [\"S45\",4032,7,0],[\"S44\",3110,7,1],[\"S43\",4147,7,2],\n [\"S51\",4147,8,0],[\"S50\",3225,8,1],[\"S49\",4147,8,2]\n].map(([N,T,R,C])=>({N,T,R,C}));\n\nconst $ = id => document.getElementById(id);\nconst fmt = n => Number(n).toLocaleString(\"tr-TR\",{maximumFractionDigits:0});\nlet latest = null;\n// Poy: mevcut tonaj dengesi önceliği. Düğüm: fiziksel yakınlığa daha fazla ağırlık.\nlet placementMode = \"poy\";\n// Tam ekran durumu yeniden hesaplamalarda (ör. Poy/Düğüm geçişi) korunur.\nlet fullscreenOn = false;\n\nfor(let i=1;i<=6;i++){const o=document.createElement(\"option\");o.value=i;o.textContent=i+\" grup\";if(i===5)o.selected=true;$(\"groupCount\").append(o);}\n\nfunction renderMachineInputs(){\n  const root=$(\"machineList\");root.innerHTML=\"\";\n  initialMachines.slice().sort((a,b)=>Number(a.N.slice(1))-Number(b.N.slice(1))).forEach(m=>{\n    const div=document.createElement(\"div\");div.className=\"machine\";div.dataset.name=m.N;\n    const check=document.createElement(\"input\");check.type=\"checkbox\";check.checked=true;check.id=\"inc-\"+m.N;check.setAttribute(\"aria-label\",m.N+\" dağıtıma dahil\");\n    const label=document.createElement(\"label\");label.htmlFor=check.id;label.textContent=m.N;\n    const closedTag=document.createElement(\"span\");closedTag.className=\"closed-tag\";closedTag.textContent=\"KAPALI\";label.append(closedTag);\n    const status={get value(){return check.checked?\"active\":\"closed\";}};\n    const wrap=document.createElement(\"div\");wrap.style.gridColumn=\"1/-1\";\n    const ton=document.createElement(\"input\");ton.type=\"number\";ton.min=\"0\";ton.step=\"any\";ton.placeholder=\"Bilinmiyor\";ton.value=m.T===null?\"\":m.T;ton.id=\"ton-\"+m.N;ton.setAttribute(\"aria-label\",m.N+\" tonajı\");\n    ton.addEventListener(\"input\",()=>{saveInputs();scheduleRecalc();});\n    const updateCard=()=>{const isJoker=jokerCheck.checked;div.classList.toggle(\"excluded\",!check.checked&&!isJoker);div.classList.toggle(\"closed-machine\",!check.checked);div.classList.toggle(\"joker-selected\",isJoker);label.classList.toggle(\"closed-label\",status.value===\"closed\"||isJoker);closedTag.hidden=check.checked;};\n\n    const jokerWrap=document.createElement(\"label\");jokerWrap.className=\"joker-toggle\";\n    const jokerCheck=document.createElement(\"input\");jokerCheck.type=\"checkbox\";jokerCheck.checked=false;jokerCheck.id=\"joker-\"+m.N;jokerCheck.setAttribute(\"aria-label\",m.N+\" Joker\");\n    const jokerText=document.createElement(\"span\");jokerText.className=\"joker-text\";jokerText.textContent=\"Joker Poycu-Düğüm\";\n    jokerWrap.append(jokerCheck,jokerText);\n    const syncJoker=()=>{div.classList.toggle(\"joker-selected\",jokerCheck.checked);};\n    jokerCheck.addEventListener(\"change\",()=>{updateCard();syncJoker();saveInputs();scheduleRecalc();});\n    check.addEventListener(\"change\",()=>{if(!check.checked)jokerCheck.checked=false;updateCard();syncJoker();saveInputs();scheduleRecalc();});\n    wrap.append(ton);div.append(check,label,jokerWrap,wrap);root.append(div);\n    updateCard();syncJoker();\n  });\n}\nrenderMachineInputs();\n\n// Girilen tonajları, seçimleri ve grup sayısını bu tarayıcıda otomatik sakla.\nconst STORAGE_KEY = \"makineDagitimPlanlayici_v1\";\nfunction saveInputs(){\n  try{\n    const data = {\n      groupCount: $(\"groupCount\").value,\n      machines: initialMachines.map(m => ({\n        name: m.N,\n        ton: $(\"ton-\"+m.N).value,\n        included: $(\"inc-\"+m.N).checked,\n        status: $(\"inc-\"+m.N).checked ? \"active\" : \"closed\",\n        joker: $(\"joker-\"+m.N) ? $(\"joker-\"+m.N).checked : false\n      }))\n    };\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));\n  }catch(e){\n    // Tarayıcı yerel depolamayı engelliyorsa sayfanın çalışması devam etsin.\n  }\n}\nfunction restoreInputs(){\n  try{\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if(!raw) return;\n    const data = JSON.parse(raw);\n    if(data.groupCount && [...$(\"groupCount\").options].some(o => o.value === String(data.groupCount))){\n      $(\"groupCount\").value = String(data.groupCount);\n    }\n    if(Array.isArray(data.machines)){\n      data.machines.forEach(saved => {\n        if(!saved || !initialMachines.some(m => m.N === saved.name)) return;\n        const ton = $(\"ton-\"+saved.name);\n        const check = $(\"inc-\"+saved.name);\n        if(ton) ton.value = saved.ton == null ? \"\" : String(saved.ton);\n        if(check) check.checked = saved.included !== undefined ? Boolean(saved.included) : saved.status !== \"closed\";\n        const joker = $(\"joker-\"+saved.name); if(joker) joker.checked = !!(check && check.checked) && (Boolean(saved.joker) || saved.status === \"joker\");\n        const card = check && check.closest(\".machine\");\n        if(card){const jc=card.querySelector(\".joker-toggle input\");const isJoker=!!jc&&jc.checked;card.classList.toggle(\"excluded\", !check.checked&&!isJoker);card.classList.toggle(\"closed-machine\", !!check&&!check.checked);card.classList.toggle(\"joker-selected\",isJoker);const label=card.querySelector(\"label\");if(label)label.classList.toggle(\"closed-label\",!!check&&!check.checked||isJoker);const tag=card.querySelector(\".closed-tag\");if(tag)tag.hidden=check.checked;}\n      });\n    }\n  }catch(e){\n    // Bozuk/eski kayıt varsa sayfa varsayılan değerlerle açılır.\n  }\n}\nrestoreInputs();\n$(\"groupCount\").addEventListener(\"change\",()=>{saveInputs();scheduleRecalc();});\n$(\"selectNone\").onclick=()=>document.querySelectorAll('#machineList > .machine > input[type=checkbox]').forEach(c=>{c.checked=false;c.dispatchEvent(new Event(\"change\"));});\n$(\"selectAll\").onclick=()=>document.querySelectorAll('#machineList > .machine > input[type=checkbox]').forEach(c=>{c.checked=true;c.dispatchEvent(new Event(\"change\"));});\n\nfunction readMachines(){\n return initialMachines.map(m=>{\n  const included=$(\"inc-\"+m.N).checked;\n  const raw=$(\"ton-\"+m.N).value.trim();\n  const T=raw===\"\"?null:Number(raw);\n  if(raw!==\"\"&&(!Number.isFinite(T)||T<0))throw new Error(m.N+\" tonajı sıfır veya daha büyük geçerli bir sayı olmalıdır.\");\n  const status=$(\"inc-\"+m.N).checked ? \"active\" : \"closed\";\n  const joker=$(\"joker-\"+m.N).checked;\n  return {...m,T,included,status,joker};\n }).filter(m=>m.included && !m.joker && m.T!==null); // Tonaj değeri girilmemiş makineler dağıtıma alınmaz.\n}\n// Dağıtım dışı makineler ve kapalı makineler ayrı listelerde tutulur.\nconst EXCLUDED_GROUP_NO=5;\nfunction readExcluded(){\n return []; /* İşareti kaldırılan makineler kapalı sayılır; dağıtım dışı grubu oluşturulmaz. */ /*return initialMachines.filter(m=>!$(\"inc-\"+m.N).checked && !$(\"joker-\"+m.N).checked).map(m=>{\n  const raw=$(\"ton-\"+m.N).value.trim(),T=raw===\"\"?null:Number(raw);\n  return {...m,T:Number.isFinite(T)&&T>=0?T:null,included:false,status:\"excluded\"};\n });*/\n}\nfunction readJoker(){\n return initialMachines.filter(m=>$(\"joker-\"+m.N).checked && $(\"inc-\"+m.N).checked).map(m=>{\n  const raw=$(\"ton-\"+m.N).value.trim(),T=raw===\"\"?null:Number(raw);\n  return {...m,T:Number.isFinite(T)&&T>=0?T:null,included:false,status:\"joker\"};\n });\n}\nfunction readClosed(){\n return initialMachines.filter(m=>!$(\"inc-\"+m.N).checked).map(m=>{\n  const raw=$(\"ton-\"+m.N).value.trim(),T=raw===\"\"?null:Number(raw);\n  return {...m,T:Number.isFinite(T)&&T>=0?T:null,included:false,status:\"closed\"};\n });\n}\nconst rand=()=>Math.random();\nconst shuffled=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};\nfunction score(groups,target,targetCount){\n let s=0;\n for(const grp of groups){\n  const sum=grp.reduce((a,m)=>a+(m.T===null?0:m.T),0);\n  s+=(sum-target)**2;\n  s+=(grp.length-targetCount)**2*250000;\n  if(grp.length>1){\n   const avgR=grp.reduce((a,m)=>a+m.R,0)/grp.length,avgC=grp.reduce((a,m)=>a+m.C,0)/grp.length;\n   for(const m of grp)s+=(((m.R-avgR)**2+(m.C-avgC)**2)*(placementMode === \"dugum\" ? 5200 : 1800));\n   for(let i=0;i<grp.length;i++)for(let j=i+1;j<grp.length;j++){\n    const dr=Math.abs(grp[i].R-grp[j].R),dc=Math.abs(grp[i].C-grp[j].C);\n    if(dr<=1&&dc<=1&&(dr+dc)>0)s-=(placementMode === \"dugum\" ? 3500 : 1200);\n   }\n  }\n }\n return s;\n}\nfunction optimize(active,k){\n const total=active.reduce((a,m)=>a+(m.T===null?0:m.T),0),target=total/k,targetCount=active.length/k;\n let best=null,bestScore=Infinity;\n for(let attempt=0;attempt<250;attempt++){\n  // PowerShell'deki gibi eşit tonajlılarda rastgelelik; ağır makineler önce.\n  const seq=shuffled(active).sort((a,b)=>(b.T??0)-(a.T??0));\n  const groups=Array.from({length:k},()=>[]),sums=Array(k).fill(0);\n  for(let g=0;g<k;g++){groups[g].push(seq[g]);sums[g]+=(seq[g].T??0);}\n  for(let i=k;i<seq.length;i++){\n   const m=seq[i],ton=m.T??0;\n   let choices=Array.from({length:k},(_,g)=>({g,v:(sums[g]+ton-target)**2+(groups[g].length+1-targetCount)**2*250000+Math.floor(Math.random()*10000)})).sort((a,b)=>a.v-b.v);\n   const chosen=choices[0].g;groups[chosen].push(m);sums[chosen]+=ton;\n  }\n  let improved=true,passes=0;\n  while(improved&&passes<3){\n   improved=false;passes++;let current=score(groups,target,targetCount);\n   for(let a=0;a<k;a++){\n    for(let ia=0;ia<groups[a].length;ia++){\n     const ma=groups[a][ia];\n     if(groups[a].length>1){\n      for(let b=0;b<k;b++){\n       if(a===b)continue;\n       groups[a].splice(ia,1);groups[b].push(ma);\n       const ns=score(groups,target,targetCount);\n       if(ns<current-0.001){current=ns;improved=true;ia--;break;}\n       groups[b].pop();groups[a].splice(ia,0,ma);\n      }\n     }\n    }\n   }\n   for(let a=0;a<k;a++)for(let b=a+1;b<k;b++)f overflow:hidden;\n  padding:\n    max(5px,env(safe-area-inset-top))\n    max(5px,env(safe-area-inset-right))\n    max(5px,env(safe-area-inset-bottom))\n    max(5px,env(safe-area-inset-left));\n}\n\n/* Yatay telefonda iki bölüm yan yana ve tüm yüksekliği doldursun */\n@media (orientation:landscape) and (max-height:700px){\n  .visual-result.fs-overlay{\n    display:grid !important;\n    grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;\n    grid-template-rows:minmax(0,1fr);\n    gap:8px;\n    align-items:stretch;\n  }\n\n  .visual-result.fs-overlay .machine-matrix-wrap,\n  .visual-result.fs-overlay .summary-panel{\n    min-width:0;\n    min-height:0;\n    height:100%;\n    overflow:hidden;\n    display:flex;\n    flex-direction:column;\n  }\n\n  .visual-result.fs-overlay .visual-heading{\n    flex:0 0 auto;\n    margin:1px 0 4px;\n    font-size:.8rem;\n  }\n\n  .visual-result.fs-overlay .mode-switch{\n    flex:0 0 auto;\n    margin:0 0 4px;\n    gap:4px;\n  }\n\n  .visual-result.fs-overlay .mode-switch button{\n    padding:4px 8px;\n    font-size:.72rem;\n  }\n\n  .visual-result.fs-overlay .operator-box{\n    padding:2px 8px;\n    font-size:.82rem;\n    min-height:28px;\n  }\n\n  .visual-result.fs-overlay .mode-note{\n    flex:0 0 auto;\n    margin:0 0 4px;\n    font-size:.65rem;\n    line-height:1.15;\n  }\n\n  /* 9 satır ekran yüksekliğine yayılır */\n  .visual-result.fs-overlay .machine-matrix{\n    flex:1 1 auto;\n    min-height:0;\n    height:auto;\n    grid-template-rows:repeat(9,minmax(0,1fr));\n    grid-auto-rows:minmax(0,1fr);\n  }\n\n  .visual-result.fs-overlay .matrix-cell,\n  .visual-result.fs-overlay .matrix-empty{\n    min-height:0;\n    height:auto;\n    padding:3px 6px;\n    font-size:.78rem;\n  }\n\n  .visual-result.fs-overlay .summary-table{\n    flex:1 1 auto;\n    min-height:0;\n    height:auto;\n    overflow:hidden;\n  }\n\n  .visual-result.fs-overlay .summary-row{\n    flex:1 1 0;\n    min-height:0;\n    height:auto;\n  }\n\n  .visual-result.fs-overlay .summary-row > div{\n    padding:4px 6px;\n    font-size:.72rem;\n  }\n\n  .visual-result.fs-overlay .summary-head{\n    flex:0 0 30px;\n    min-height:30px;\n  }\n\n  .visual-result.fs-overlay .summary-head > div{\n    font-size:.68rem;\n  }\n\n  /* Tam ekran butonu üstte sabit kalırken alan kaplamasın */\n  .visual-result.fs-overlay .fs-btn{\n    position:static;\n    flex:0 0 auto;\n  }\n}\n\n/* Çok geniş yatay telefonlarda da içerik kenarlara yayılsın */\n@media (orientation:landscape) and (min-height:701px){\n  .visual-result.fs-overlay{\n    display:grid !important;\n    grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;\n    grid-template-rows:minmax(0,1fr);\n    height:100dvh;\n    min-height:100dvh;\n    gap:10px;\n    overflow:hidden;\n  }\n\n  .visual-result.fs-overlay .machine-matrix-wrap,\n  .visual-result.fs-overlay .summary-panel{\n    height:100%;\n    min-height:0;\n    overflow:hidden;\n    display:flex;\n    flex-direction:column;\n  }\n\n  .visual-result.fs-overlay .machine-matrix{\n    flex:1 1 auto;\n    min-height:0;\n    grid-template-rows:repeat(9,minmax(0,1fr));\n  }\n\n  .visual-result.fs-overlay .summary-table{\n    flex:1 1 auto;\n    min-height:0;\n  }\n\n  .visual-result.fs-overlay .summary-row{\n    flex:1 1 0;\n    min-height:0;\n  }\n}\n\n/* Dikey telefonda mevcut davranış korunur */\n@media (orientation:portrait) and (max-width:600px){\n  .visual-result.fs-overlay{\n    overflow:auto;\n    -webkit-overflow-scrolling:touch;\n  }\n}\n\n\n/* Telefon: hesaplamadan sonra ekran sonuç kartının başından başlasın */\n#resultCard{scroll-margin-top:4px}\n@media(max-width:600px){\n  #resultCard{padding:6px 6px 8px}\n  #resultCard h2{margin:0 0 6px;font-size:.95rem}\n  #resultCard .stats{margin-bottom:6px}\n  #resultCard .stat{padding:5px 8px}\n  #resultCard .stat strong{margin-top:2px;font-size:.95rem}\n  #resultCard .buttonrow{margin-top:6px}\n  #resultCard .buttonrow button{min-height:36px}\n  .footer{margin-top:6px}\n}\n</style>\n</head>\n<body>\n<header><div class=\"eyebrow\">Düğüm-Poy</div><h1>Makine Dağıtım Planlayıcısı</h1><p> Makine sayısı · Fiziksel yerleşim yakınlığı</p></header>\n<main>\n<div class=\"notice\"><strong>Bilgi:</strong>  Bilinmeyen tonajlar hesaplamada 0 kabul edilir. İşareti kaldırılan makineler Kapalı görünür ve grup özetinden çıkar. Joker seçilen makineler Joker grubunda gösterilir. Hesaplama bu tarayıcıda yapılır, girilen veriler sunucuya gönderilmez.</div>\n<div class=\"layout\">\n<section class=\"card\">\n<h2>Dağıtım ayarları</h2>\n<label class=\"field\" for=\"groupCount\">Oluşturulacak grup sayısı (1–6)</label>\n<select id=\"groupCount\"></select>\n<p class=\"small\">Algoritma, PowerShell sürümündeki 250 rastgele denemeyi ve yerel iyileştirme adımlarını temel alır.</p><p class=\"small\">Otomatik kayıt açık: Tonajlar, makine seçimleri ve grup sayısı bu tarayıcıda saklanır; sayfayı yeniden açtığınızda geri yüklenir.</p>\n<div class=\"buttonrow\"><button id=\"selectNone\" class=\"secondary\" type=\"button\">Tüm seçimleri kaldır</button><button id=\"selectAll\" class=\"secondary\" type=\"button\">Tümünü dahil et</button></div>\n<label class=\"field\">Makine listesi <span class=\"small\">(işaretini kaldırırsanız makine Kapalı olur ve grup özetinden çıkar)</span></label>\n<div id=\"machineList\" class=\"machine-list\"></div>\n<button id=\"run\" class=\"primary\" type=\"button\">Dengeli dağıtımı hesapla</button>\n<div id=\"error\" class=\"error\" role=\"alert\"></div>\n</section>\n<section class=\"card\" id=\"resultCard\">\n<div id=\"results\"><div class=\"empty\">Tonaj girdiğinizde veya seçimleri değiştirdiğinizde sonuç otomatik olarak yenilenir.</div></div>\n<div id=\"downloads\" class=\"buttonrow\" hidden><button id=\"downloadCsv\" class=\"secondary\" type=\"button\">CSV indir</button><button id=\"downloadTxt\" class=\"secondary\" type=\"button\">TXT raporu indir</button></div>\n</section>\n</div>\n<div class=\"footer\">Algoritma puanlaması: tonaj farkı ana kriter, makine sayısı ikincil kriter, fiziksel yakınlık daha düşük ağırlıktadır. Sonuçlar rastgele başlangıç sırasına bağlı olarak çalıştırmalar arasında değişebilir.</div>\n</main>\n<script>\n// MakineDagitim PowerShell algoritmasının tarayıcı sürümü.\n// Yerleşim (R/C), puan ağırlıkları, 250 deneme ve yerel iyileştirme korunmuştur.\nconst initialMachines = [\n [\"S3\",3110,0,0],[\"S2\",3628,0,1],[\"S1\",4608,0,2],\n [\"S9\",3110,1,0],[\"S8\",3918,1,1],[\"S7\",3110,1,2],\n [\"S15\",4147,2,0],[\"S14\",3110,2,1],[\"S13\",4147,2,2],\n [\"S21\",4147,3,0],[\"S20\",null,3,1],[\"S19\",6451,3,2],\n [\"S27\",4147,4,0],[\"S26\",7833,4,1],[\"S25\",null,4,2],\n [\"S33\",3916,5,0],[\"S32\",4531,5,1],[\"S31\",7603,5,2],\n [\"S39\",2995,6,0],[\"S38\",4147,6,1],[\"S37\",4147,6,2],\n [\"S45\",4032,7,0],[\"S44\",3110,7,1],[\"S43\",4147,7,2],\n [\"S51\",4147,8,0],[\"S50\",3225,8,1],[\"S49\",4147,8,2]\n].map(([N,T,R,C])=>({N,T,R,C}));\n\nconst $ = id => document.getElementById(id);\nconst fmt = n => Number(n).toLocaleString(\"tr-TR\",{maximumFractionDigits:0});\nlet latest = null;\n// Poy: mevcut tonaj dengesi önceliği. Düğüm: fiziksel yakınlığa daha fazla ağırlık.\nlet placementMode = \"poy\";\n// Tam ekran durumu yeniden hesaplamalarda (ör. Poy/Düğüm geçişi) korunur.\nlet fullscreenOn = false;\n\nfor(let i=1;i<=6;i++){const o=document.createElement(\"option\");o.value=i;o.textContent=i+\" grup\";if(i===5)o.selected=true;$(\"groupCount\").append(o);}\n\nfunction renderMachineInputs(){\n  const root=$(\"machineList\");root.innerHTML=\"\";\n  initialMachines.slice().sort((a,b)=>Number(a.N.slice(1))-Number(b.N.slice(1))).forEach(m=>{\n    const div=document.createElement(\"div\");div.className=\"machine\";div.dataset.name=m.N;\n    const check=document.createElement(\"input\");check.type=\"checkbox\";check.checked=true;check.id=\"inc-\"+m.N;check.setAttribute(\"aria-label\",m.N+\" dağıtıma dahil\");\n    const label=document.createElement(\"label\");label.htmlFor=check.id;label.textContent=m.N;\n    const closedTag=document.createElement(\"span\");closedTag.className=\"closed-tag\";closedTag.textContent=\"KAPALI\";label.append(closedTag);\n    const status={get value(){return check.checked?\"active\":\"closed\";}};\n    const wrap=document.createElement(\"div\");wrap.style.gridColumn=\"1/-1\";\n    const ton=document.createElement(\"input\");ton.type=\"number\";ton.min=\"0\";ton.step=\"any\";ton.placeholder=\"Bilinmiyor\";ton.value=m.T===null?\"\":m.T;ton.id=\"ton-\"+m.N;ton.setAttribute(\"aria-label\",m.N+\" tonajı\");\n    ton.addEventListener(\"input\",()=>{saveInputs();scheduleRecalc();});\n    const updateCard=()=>{const isJoker=jokerCheck.checked;div.classList.toggle(\"excluded\",!check.checked&&!isJoker);div.classList.toggle(\"closed-machine\",!check.checked);div.classList.toggle(\"joker-selected\",isJoker);label.classList.toggle(\"closed-label\",status.value===\"closed\"||isJoker);closedTag.hidden=check.checked;};\n\n    const jokerWrap=document.createElement(\"label\");jokerWrap.className=\"joker-toggle\";\n    const jokerCheck=document.createElement(\"input\");jokerCheck.type=\"checkbox\";jokerCheck.checked=false;jokerCheck.id=\"joker-\"+m.N;jokerCheck.setAttribute(\"aria-label\",m.N+\" Joker\");\n    const jokerText=document.createElement(\"span\");jokerText.className=\"joker-text\";jokerText.textContent=\"Joker Poycu-Düğüm\";\n    jokerWrap.append(jokerCheck,jokerText);\n    const syncJoker=()=>{div.classList.toggle(\"joker-selected\",jokerCheck.checked);};\n    jokerCheck.addEventListener(\"change\",()=>{updateCard();syncJoker();saveInputs();scheduleRecalc();});\n    check.addEventListener(\"change\",()=>{if(!check.checked)jokerCheck.checked=false;updateCard();syncJoker();saveInputs();scheduleRecalc();});\n    wrap.append(ton);div.append(check,label,jokerWrap,wrap);root.append(div);\n    updateCard();syncJoker();\n  });\n}\nrenderMachineInputs();\n\n// Girilen tonajları, seçimleri ve grup sayısını bu tarayıcıda otomatik sakla.\nconst STORAGE_KEY = \"makineDagitimPlanlayici_v1\";\nfunction saveInputs(){\n  try{\n    const data = {\n      groupCount: $(\"groupCount\").value,\n      machines: initialMachines.map(m => ({\n        name: m.N,\n        ton: $(\"ton-\"+m.N).value,\n        included: $(\"inc-\"+m.N).checked,\n        status: $(\"inc-\"+m.N).checked ? \"active\" : \"closed\",\n        joker: $(\"joker-\"+m.N) ? $(\"joker-\"+m.N).checked : false\n      }))\n    };\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));\n  }catch(e){\n    // Tarayıcı yerel depolamayı engelliyorsa sayfanın çalışması devam etsin.\n  }\n}\nfunction restoreInputs(){\n  try{\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if(!raw) return;\n    const data = JSON.parse(raw);\n    if(data.groupCount && [...$(\"groupCount\").options].some(o => o.value === String(data.groupCount))){\n      $(\"groupCount\").value = String(data.groupCount);\n    }\n    if(Array.isArray(data.machines)){\n      data.machines.forEach(saved => {\n        if(!saved || !initialMachines.some(m => m.N === saved.name)) return;\n        const ton = $(\"ton-\"+saved.name);\n        const check = $(\"inc-\"+saved.name);\n        if(ton) ton.value = saved.ton == null ? \"\" : String(saved.ton);\n        if(check) check.checked = saved.included !== undefined ? Boolean(saved.included) : saved.status !== \"closed\";\n        const joker = $(\"joker-\"+saved.name); if(joker) joker.checked = !!(check && check.checked) && (Boolean(saved.joker) || saved.status === \"joker\");\n        const card = check && check.closest(\".machine\");\n        if(card){const jc=card.querySelector(\".joker-toggle input\");const isJoker=!!jc&&jc.checked;card.classList.toggle(\"excluded\", !check.checked&&!isJoker);card.classList.toggle(\"closed-machine\", !!check&&!check.checked);card.classList.toggle(\"joker-selected\",isJoker);const label=card.querySelector(\"label\");if(label)label.classList.toggle(\"closed-label\",!!check&&!check.checked||isJoker);const tag=card.querySelector(\".closed-tag\");if(tag)tag.hidden=check.checked;}\n      });\n    }\n  }catch(e){\n    // Bozuk/eski kayıt varsa sayfa varsayılan değerlerle açılır.\n  }\n}\nrestoreInputs();\n$(\"groupCount\").addEventListener(\"change\",()=>{saveInputs();scheduleRecalc();});\n$(\"selectNone\").onclick=()=>document.querySelectorAll('#machineList > .machine > input[type=checkbox]').forEach(c=>{c.checked=false;c.dispatchEvent(new Event(\"change\"));});\n$(\"selectAll\").onclick=()=>document.querySelectorAll('#machineList > .machine > input[type=checkbox]').forEach(c=>{c.checked=true;c.dispatchEvent(new Event(\"change\"));});\n\nfunction readMachines(){\n return initialMachines.map(m=>{\n  const included=$(\"inc-\"+m.N).checked;\n  const raw=$(\"ton-\"+m.N).value.trim();\n  const T=raw===\"\"?null:Number(raw);\n  if(raw!==\"\"&&(!Number.isFinite(T)||T<0))throw new Error(m.N+\" tonajı sıfır veya daha büyük geçerli bir sayı olmalıdır.\");\n  const status=$(\"inc-\"+m.N).checked ? \"active\" : \"closed\";\n  const joker=$(\"joker-\"+m.N).checked;\n  return {...m,T,included,status,joker};\n }).filter(m=>m.included && !m.joker && m.T!==null); // Tonaj değeri girilmemiş makineler dağıtıma alınmaz.\n}\n// Dağıtım dışı makineler ve kapalı makineler ayrı listelerde tutulur.\nconst EXCLUDED_GROUP_NO=5;\nfunction readExcluded(){\n return []; /* İşareti kaldırılan makineler kapalı sayılır; dağıtım dışı grubu oluşturulmaz. */ /*return initialMachines.filter(m=>!$(\"inc-\"+m.N).checked && !$(\"joker-\"+m.N).checked).map(m=>{\n  const raw=$(\"ton-\"+m.N).value.trim(),T=raw===\"\"?null:Number(raw);\n  return {...m,T:Number.isFinite(T)&&T>=0?T:null,included:false,status:\"excluded\"};\n });*/\n}\nfunction readJoker(){\n return initialMachines.filter(m=>$(\"joker-\"+m.N).checked && $(\"inc-\"+m.N).checked).map(m=>{\n  const raw=$(\"ton-\"+m.N).value.trim(),T=raw===\"\"?null:Number(raw);\n  return {...m,T:Number.isFinite(T)&&T>=0?T:null,included:false,status:\"joker\"};\n });\n}\nfunction readClosed(){\n return initialMachines.filter(m=>!$(\"inc-\"+m.N).checked).map(m=>{\n  const raw=$(\"ton-\"+m.N).value.trim(),T=raw===\"\"?null:Number(raw);\n  return {...m,T:Number.isFinite(T)&&T>=0?T:null,included:false,status:\"closed\"};\n });\n}\nconst rand=()=>Math.random();\nconst shuffled=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};\nfunction score(groups,target,targetCount){\n let s=0;\n for(const grp of groups){\n  const sum=grp.reduce((a,m)=>a+(m.T===null?0:m.T),0);\n  s+=(sum-target)**2;\n  s+=(grp.length-targetCount)**2*250000;\n  if(grp.length>1){\n   const avgR=grp.reduce((a,m)=>a+m.R,0)/grp.length,avgC=grp.reduce((a,m)=>a+m.C,0)/grp.length;\n   for(const m of grp)s+=(((m.R-avgR)**2+(m.C-avgC)**2)*(placementMode === \"dugum\" ? 22000 : 1800));\n   for(let i=0;i<grp.length;i++)for(let j=i+1;j<grp.length;j++){\n    const dr=Math.abs(grp[i].R-grp[j].R),dc=Math.abs(grp[i].C-grp[j].C);\n    if(dr<=1&&dc<=1&&(dr+dc)>0)s-=(placementMode === \"dugum\" ? 9000 : 1200);\n   }\n  }\n }\n return s;\n}\nfunction optimize(active,k){\n const total=active.reduce((a,m)=>a+(m.T===null?0:m.T),0),target=total/k,targetCount=active.length/k;\n let best=null,bestScore=Infinity;\n for(let attempt=0;attempt<250;attempt++){\n  // PowerShell'deki gibi eşit tonajlılarda rastgelelik; ağır makineler önce.\n  const seq=shuffled(active).sort((a,b)=>(b.T??0)-(a.T??0));\n  const groups=Array.from({length:k},()=>[]),sums=Array(k).fill(0);\n  for(let g=0;g<k;g++){groups[g].push(seq[g]);sums[g]+=(seq[g].T??0);}\n  for(let i=k;i<seq.length;i++){\n   const m=seq[i],ton=m.T??0;\n   let choices=Array.from({length:k},(_,g)=>({g,v:(sums[g]+ton-target)**2+(groups[g].length+1-targetCount)**2*250000+Math.floor(Math.random()*10000)})).sort((a,b)=>a.v-b.v);\n   const chosen=choices[0].g;groups[chosen].push(m);sums[chosen]+=ton;\n  }\n  let improved=true,passes=0;\n  while(improved&&passes<3){\n   improve
